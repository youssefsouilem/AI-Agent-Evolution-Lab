spring.application.name=m3-mission-service
server.port=8083

# Shared Eureka registry: opt in when the team's server is running.
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/m3_mission_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
# M1 integration: disabled keeps the local JSON catalogue.
m1.enabled=${M1_ENABLED:false}
m1.base-url=${M1_BASE_URL:http://localhost:8081}
m1.connect-timeout-ms=${M1_CONNECT_TIMEOUT_MS:2000}
m1.read-timeout-ms=${M1_READ_TIMEOUT_MS:5000}

# M6 monitoring: simulated fixtures until the real service is available.
m6.enabled=${M6_ENABLED:false}
m6.base-url=${M6_BASE_URL:http://localhost:8086}
m6.detect-path=${M6_DETECT_PATH:/api/anomalies/detect}
m6.connect-timeout-ms=${M6_CONNECT_TIMEOUT_MS:2000}
m6.read-timeout-ms=${M6_READ_TIMEOUT_MS:5000}
m6.mock-scenario=${M6_MOCK_SCENARIO:NORMAL}

# Python orchestration bridge. Disable explicitly for isolated CRUD-only use.
orchestrator.enabled=${ORCHESTRATOR_ENABLED:true}
orchestrator.base-url=${ORCHESTRATOR_BASE_URL:http://127.0.0.1:8093}

# Local development remains explicit; enable JWT verification for shared integration.
security.enabled=${SECURITY_ENABLED:false}
security.issuer-uri=${KEYCLOAK_ISSUER_URI:}

security.audience=${KEYCLOAK_AUDIENCE:m3-mission-service}
orchestrator.token=${ORCHESTRATOR_TOKEN:}

# Delivery contract to confirm with M7; disabled until RabbitMQ is configured.
events.enabled=${EVENTS_ENABLED:false}
events.exchange=${EVENTS_EXCHANGE:mission.events}
events.routing-key=${EVENTS_ROUTING_KEY:mission.lifecycle}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

ai.router-agent-id=${AI_ROUTER_AGENT_ID:}
ai.router-version-id=${AI_ROUTER_VERSION_ID:}

spring.config.import=optional:file:./application-local.properties,optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
# Disabled for individual local work. Enable when the shared Config Server is ready.
spring.cloud.config.enabled=${CONFIG_CLIENT_ENABLED:false}
spring.cloud.config.profile=${CONFIG_PROFILE:default}
spring.cloud.config.label=${CONFIG_LABEL:main}
spring.cloud.config.request-connect-timeout=2000
spring.cloud.config.request-read-timeout=5000
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.rabbit.enabled=${events.enabled:false}
EUREKA_ENABLED=true
EUREKA_SERVER_URL=http://localhost:8761/eureka/
