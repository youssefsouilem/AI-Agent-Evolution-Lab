server:
  port: 8081

spring:
  application:
    name: agent-service
  profiles:
    default: dev
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 10000
  datasource:
    url: jdbc:h2:file:./data/agentdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:missing-key}
      chat:
        options:
          model: gpt-4o-mini
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ai-lab}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: http://localhost:8761/eureka

tools:
  service:
    url: ${TOOLS_SERVICE_URL:http://localhost:8082}

management:
  endpoint:
    health:
      probes:
        enabled: false
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      enabled: false

logging:
  level:
    tn.esprit.agentservice: DEBUG

app:
  events:
    agent-exchange: agent.events
    queue-name: agent.events
    routing-keys:
      agent-created: agent.created
      agent-updated: agent.updated
      agent-deleted: agent.deleted
      agent-executed: agent.executed
      agent-execution-failed: agent.execution.failed

m1:
  cors:
    allowed-origins: ${M1_CORS_ALLOWED_ORIGINS:}
  quota:
    user-max-agents: 5
  llm:
    strict-model-check: true
    providers:
      - id: openai
        label: OpenAI
        enabled: true
        api-key-env: OPENAI_API_KEY
        models:
          - id: gpt-4o-mini
            label: GPT-4o mini
            recommended: true
      - id: anthropic
        label: Anthropic
        enabled: true
        api-key-env: ANTHROPIC_API_KEY
        models: []
      - id: gemini
        label: Google Gemini
        enabled: true
        api-key-env: GEMINI_API_KEY
        models: []
  assist:
    max-per-hour: 10
  events:
    legacy-aliases: true
  outbox:
    poll-interval-ms: 2000
    max-attempts: 10
    confirm-timeout-ms: 5000
  executions:
    stale-after-minutes: 5
  demo:
    seed: false
