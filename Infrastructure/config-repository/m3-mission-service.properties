# Example to copy into the team's Config Server Git repository.
# This file is not loaded simply because it exists here.
# Profile: default. Git branch: main, unless the team chooses another label.
server.port=${SERVER_PORT:8083}

m1.enabled=${M1_ENABLED:false}
m1.base-url=${M1_BASE_URL:http://localhost:8081}
m6.enabled=${M6_ENABLED:false}
m6.base-url=${M6_BASE_URL:http://localhost:8086}
orchestrator.enabled=${ORCHESTRATOR_ENABLED:true}
orchestrator.base-url=${ORCHESTRATOR_BASE_URL:http://127.0.0.1:8093}

spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Keep database credentials, JWTs and internal tokens out of the Git repository.
# Configure them using environment variables or the team's secret store.
