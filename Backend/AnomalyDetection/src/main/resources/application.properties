spring.application.name=AnomalyDetection

# Persistent H2 database. H2 creates the database and its parent directory on first startup.
spring.datasource.url=jdbc:h2:file:./data/anomaly_detection_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create/update the schema from the JPA entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 browser console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAPI and Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
server.port=8086